<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Check current weather conditions for your city.">

    <title>Weather App</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>

    <header class="app-header">
        <h1>Weather App</h1>
        <p>Your daily weather companion</p>
    </header>

    <main class="container">

        <form id="search-form" class="search-form">
            <label for="city-input">Search for a city</label>

            <div class="search-controls">
                <input
                    type="text"
                    id="city-input"
                    name="city"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="search-button">
                    Search
                </button>
            </div>
        </form>

        <p id="status-message" role="status" aria-live="polite"></p>

        <section id="weather-section" class="weather-section"
                 aria-label="Current weather" hidden>

            <div class="weather-card">

                <div class="weather-heading">
                    <div>
                        <h2 id="city-name">City</h2>
                        <p id="weather-description">Weather condition</p>
                    </div>

                    <img
                        id="weather-icon"
                        src=""
                        alt=""
                        hidden
                    >
                </div>

                <p id="temperature" class="temperature">--°C</p>

                <p id="feels-like">Feels like: --°C</p>

                <div class="details-grid">

                    <article class="detail-card">
                        <h3>Humidity</h3>
                        <p id="humidity">--%</p>
                    </article>

                    <article class="detail-card">
                        <h3>Wind Speed</h3>
                        <p id="wind-speed">--</p>
                    </article>

                    <article class="detail-card">
                        <h3>Pressure</h3>
                        <p id="pressure">--</p>
                    </article>

                </div>

            </div>

        </section>

    </main>

    <footer class="app-footer">
        <p>Weather App &copy; 2026</p>
    </footer>

</body>

</html>
